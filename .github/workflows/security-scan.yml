name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The gosec action image cannot read Go 1.27 export data yet.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@master

      - name: Run gosec security scan
        run: gosec ./...

      - name: Run govulncheck vulnerability scan
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...
