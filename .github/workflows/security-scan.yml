name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run gosec security scan
        uses: securego/gosec@master
        env:
          GOTOOLCHAIN: auto
        with:
          args: ./...

      - name: Run govulncheck vulnerability scan
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...
