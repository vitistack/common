# Default values for vitistack-crds
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Whether to create the CRDs
crds:
  # Keep CRDs on helm uninstall
  keep: true
  
# Annotations to add to all CRD resources
annotations: {}
  # example.com/annotation: "value"

# Labels to add to all CRD resources
labels: {}
  # example.com/label: "value"

# Conversion webhook server — serves v1alpha1 <-> v1alpha2 conversion
# for CRDs that have multiple API versions.
conversionWebhook:
  enabled: true
  image:
    repository: ghcr.io/vitistack/viti-crd-conversion-webhook
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 2
  port: 9443
  resources:
    # No CPU limit on purpose: the webhook is a synchronous dependency in the
    # apiserver's critical path, so CPU throttling directly adds API latency.
    # Keep the request to guarantee scheduling; drop the cap. Memory limit gives
    # headroom for batched list conversions (apiserver may send all objects of a
    # kind in one ConversionReview) — memory is non-compressible, so over = OOMKill.
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 48Mi
  # cert-manager is used to provision TLS certificates for the webhook.
  certManager:
    enabled: true
    issuerRef: {}
    #   name: my-issuer
    #   kind: ClusterIssuer

