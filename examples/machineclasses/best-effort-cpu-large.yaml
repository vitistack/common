---
apiVersion: vitistack.io/v1alpha1
kind: MachineClass
metadata:
  name: best-effort-cpu-large
spec:
  displayName: Best Effort CPU Large
  description: Best-effort instance with 8 cores and 16Gi memory (Tanzu best-effort-cpu-large)
  enabled: true
  default: false
  category: CPU
  cpu:
    cores: 8
    sockets: 1
    threads: 1
  memory:
    quantity: 16Gi
  machineProviders: []
