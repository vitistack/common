---
apiVersion: vitistack.io/v1alpha1
kind: MachineClass
metadata:
  name: best-effort-large
spec:
  displayName: Best Effort Large
  description: Best-effort instance with 4 cores and 16Gi memory (Tanzu best-effort-large)
  enabled: true
  default: false
  category: Standard
  cpu:
    cores: 4
    sockets: 1
    threads: 1
  memory:
    quantity: 16Gi
  machineProviders: []
